name: clabane-academy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clabane
      POSTGRES_PASSWORD: clabane_dev_password
      POSTGRES_DB: clabane_academy
    ports:
      - "5432:5432"
    volumes:
      - clabane_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clabane -d clabane_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development. In production this
  # is swapped for Cloudflare R2 (or S3/GCS) purely via environment
  # variables — the application code is identical.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - clabane_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the buckets MinIO needs on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/clabane-academy &&
      echo 'Bucket ready'
      "

volumes:
  clabane_postgres_data:
  clabane_minio_data:
